<script>
    $(document).ready(function () {
        {% if site.google_scholar_stats_use_cdn %}
        var gsDataBaseUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@'
        {% else %}
        var gsDataBaseUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/'
        {% endif %}
        $.getJSON(gsDataBaseUrl + "google-scholar-stats/gs_data.json", function (data) {
            var totalEle = document.getElementById('total_cit');
            if (totalEle && data['citedby'] !== undefined) {
                totalEle.innerHTML = data['citedby'];
            }

            var publications = data['publications'] || {};
            var citationEles = document.getElementsByClassName('show_paper_citations');
            Array.prototype.forEach.call(citationEles, function (element) {
                // A paper with no citations yet -- or one not on the Scholar
                // profile at all -- is simply left blank. Without this guard a
                // single missing entry throws and every later counter on the
                // page stays empty.
                var publication = publications[element.getAttribute('data')];
                var numCitations = publication && publication['num_citations'];
                if (numCitations) {
                    element.innerHTML = '| Citations: ' + numCitations;
                }
            });
        });
    })
</script>
